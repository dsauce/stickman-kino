name: 🎨 Prop / pose / character / theme request
description: Ask for (or offer to draw) a new catalogue item
labels: [catalogue]
body:
  - type: dropdown
    id: kind
    attributes: { label: Kind, options: [Prop, Pose, Character preset, Theme, Environment, Music style, Sound effect, Transition] }
    validations: { required: true }
  - type: input
    id: name
    attributes: { label: Name, placeholder: "e.g. trophy-cup, cartwheel, astronaut, retro-vhs" }
    validations: { required: true }
  - type: textarea
    id: use
    attributes: { label: What story moment needs it?, description: A reference image or sketch helps. }
  - type: checkboxes
    id: help
    attributes: { label: Contribution, options: [{ label: "I'd like to draw/implement it myself (see CONTRIBUTING.md)" }] }
